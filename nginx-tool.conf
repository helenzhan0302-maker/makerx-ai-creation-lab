# MakerX AI工具盒 · tool.skftai.top
# 独立 server 块，不影响现有 skftai.top / makerx.skftai.top
server {
    listen 80;
    listen [::]:80;
    server_name tool.skftai.top;

    root /var/www/tool-skftai;
    index index.html;

    # 精确匹配优先于普通前缀匹配
    location = /resources {
        try_files /resources.html =404;
    }

    location = /resources.html {
        try_files /resources.html =404;
    }

    location / {
        try_files  / .html =404;
    }

    location = /prompts {
        return 404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
